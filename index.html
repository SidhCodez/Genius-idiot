<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F7F4" />
    <meta
      name="description"
      content="Genius Idiot is a quiet study and work tracker where a missed day rolls forward instead of piling up as overdue debt. One honest task at a time."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Genius Idiot — Missed days never become overdue." />
    <meta
      property="og:description"
      content="A quiet study and work tracker where missed tasks roll forward to tomorrow and your daily load never doubles."
    />
    <meta property="og:url" content="https://genius-idiot.vercel.app/welcome" />
    <meta property="og:image" content="https://genius-idiot.vercel.app/logo.jpg" />
    <meta name="twitter:card" content="summary" />
    <script>
      // Set the theme before first paint so dark mode never flashes light.
      (function () {
        try {
          var stored = localStorage.getItem('gi:theme');
          var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0A0A0A' : '#F7F7F4');
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <title>Genius Idiot — Missed days never become overdue.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking so first paint doesn't wait on Google Fonts. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Instrument+Serif:ital@0;1&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Instrument+Serif:ital@0;1&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
